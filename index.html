<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#583D66">
  <meta property="og:title" content="You’ve been challenged in Idiochess">
  <meta property="og:description" content="Draft your army, wield Arcana, and battle a friend.">
  <title>Idiochess — You’ve Been Challenged</title>
  <link rel="icon" href="flame-knight.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --violet: #b14eff;
      --violet-minus-one: #7a1cac;
      --light-neutral-plus-one: #fbfaff;
      --light-neutral-minus-one: #afadb8;
      --black: #1b1824;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #583d66 0%, #1b1824 100%);
      color: var(--light-neutral-plus-one);
      font-family: "Work Sans", sans-serif;
    }

    main {
      width: min(100%, 328px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    .brand-logo {
      width: 220px;
      max-width: 80%;
      height: auto;
    }

    .message {
      margin: 16px 16px 0;
      padding: 24px;
      border-radius: 8px;
      background: rgba(27, 24, 36, 0.2);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
    }

    p {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 400;
    }

    strong { color: var(--violet); }

    .actions {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .button {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--violet);
      border-radius: 32px;
      color: var(--violet);
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button.primary {
      border-color: var(--violet-minus-one);
      background: var(--violet-minus-one);
      color: var(--light-neutral-plus-one);
    }

    .button:hover { opacity: 0.88; }
    .button:active { transform: scale(0.985); }
    .button.disabled { opacity: 0.45; pointer-events: none; }

    .status {
      margin-inline: 32px;
      color: var(--light-neutral-minus-one);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img class="brand-mark" src="flame-knight.svg" alt="">
      <img class="brand-logo" src="idiochess-logo.svg" alt="Idiochess">
    </header>

    <section class="message" aria-labelledby="invite-heading">
      <h1 id="invite-heading">You’ve been challenged!</h1>
      <p id="message-text">
        A friend wants to play you in <strong>Idiochess</strong>, an asymmetric chess game where you
        place your own pieces, empower them with Arcana, and battle against friends.
      </p>
    </section>

    <div class="actions">
      <a class="button primary" id="open-link" href="#">Open in App</a>
      <a class="button" id="ios-link" href="https://apps.apple.com/app/id6819546450">Download for iOS</a>
    </div>

    <p class="status" id="status-text">After installing, tap this link again to accept the challenge.</p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const isVerified = params.get('verified') === '1';
      const heading = document.getElementById('invite-heading');
      const message = document.getElementById('message-text');
      const openLink = document.getElementById('open-link');
      const status = document.getElementById('status-text');

      if (isVerified) {
        document.title = 'Idiochess — Email Verified';
        heading.textContent = 'Email verified';
        message.textContent = 'Your email address has been verified. Return to Idiochess and sign in to continue.';
        openLink.textContent = 'Return to Idiochess';
        openLink.href = 'idiochess://verified';
        status.textContent = 'You can close this page after returning to the app.';
        return;
      }

      if (!token) {
        openLink.classList.add('disabled');
        openLink.removeAttribute('href');
        status.textContent = 'Invalid invite link.';
        return;
      }

      openLink.href = 'idiochess://invite/' + encodeURIComponent(token);
    })();
  </script>
</body>
</html>
